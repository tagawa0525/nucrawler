# nucrawler の設定。$XDG_CONFIG_HOME/nucrawler/config.toml に置く。
# 省略した項目は既定値になる。

[http]
user_agent = "nucrawler/0.1 (+https://github.com/tagawa0525/nucrawler)"
# 同じホストへの連続アクセスの間隔
per_host_delay_secs = 5
timeout_secs = 30
# 応答本文の上限（20 MiB）
max_body_bytes = 20971520

[pipeline]
# これより古い記事は本文抽出や LLM 処理の対象にしない
backlog_days = 14
# 1 回の実行で本文を抽出する記事数の上限
extract_max_per_run = 100

[llm]
# Claude Code の実行ファイル（サブスクリプションの枠内で headless 実行する）
command = "claude"
# 1 回の呼び出しのタイムアウト（秒）
timeout_secs = 300
# 要約に使うモデル、1 回の呼び出しで要約する記事数、本文の部分ごとの最大文字数
digest_model = "sonnet"
digest_batch_size = 5
max_input_chars = 6000
# 採点に使うモデルと、1 回の呼び出しで採点する記事数
score_model = "sonnet"
score_batch_size = 20
# 要約が使い切らずに採点のために残す呼び出し回数
score_reserved_calls = 1
# 全文和訳に使うモデル、先回りで和訳する点数、和訳に入れる本文の最大文字数
translate_model = "sonnet"
translate_min_score = 80
translate_max_input_chars = 20000

[quota]
# 時間帯の判定に使う時差（JST）
timezone_offset_hours = 9
# 時間帯ごとの 5 時間枠の上限（start <= 時 < end、現地時刻）。日中は多く、開発に使う深夜は少なく
slots = [
  { start = 3, end = 8, max_five_hour = 0.20 },
  { start = 10, end = 15, max_five_hour = 0.85 },
  { start = 16, end = 21, max_five_hour = 0.60 },
]
default_max_five_hour = 0.20
# 週次枠の絶対上限と、直線的な消費より何日分先行してよいか
weekly_max = 0.70
pace_ahead_days = 1.0
# 1 回の実行で呼び出してよい回数
max_calls_per_run = 30
