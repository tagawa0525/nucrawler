# nucrawler の設定。$XDG_CONFIG_HOME/nucrawler/config.toml に置く。
# 省略した項目は既定値になる。

[http]
user_agent = "nucrawler/0.1 (+https://github.com/tagawa0525/nucrawler)"
# 同じホストへの連続アクセスの間隔
per_host_delay_secs = 5
timeout_secs = 30
# 応答本文の上限（20 MiB）
max_body_bytes = 20971520

[pipeline]
# これより古い記事は本文抽出や LLM 処理の対象にしない
backlog_days = 14
# 1 回の実行で本文を抽出する記事数の上限
extract_max_per_run = 100

[llm]
# LLM を呼ぶバックエンド。"claude-cli"（Claude Code の headless 実行、サブスクリプションの枠。[quota] で抑える）か
# "copilot-cli"（GitHub Copilot CLI、AI Credits。[copilot_quota] で抑える）。切り替えるときは、下のステージごとの
# モデル名もそのバックエンドの名前にする（copilot-cli なら "gpt-6-luna" など）
backend = "claude-cli"
# バックエンドの実行ファイル。省けばバックエンドに合わせて "claude" か "copilot"（PATH から探す）。
# PATH に無いときだけ指定する（指定するとバックエンドを切り替えてもこのコマンドを使う）
# command = "/path/to/claude"
# 1 回の呼び出しのタイムアウト（秒）
timeout_secs = 300
# 同時に動かすバックエンド（claude・copilot）の数の上限（crawl・redo などの実行をまたいで数える）。1 つの実行の中でも、
# 各ステージがこの数まで同時に呼ぶ
concurrency = 2
# 要約に使うモデル、1 回の呼び出しで要約する記事数、本文の部分ごとの最大文字数
digest_model = "sonnet"
digest_batch_size = 5
max_input_chars = 6000
# 採点に使うモデルと、1 回の呼び出しで採点する記事数
score_model = "sonnet"
score_batch_size = 20
# 要約が使い切らずに採点のために残す呼び出し回数
score_reserved_calls = 1
# 全文和訳に使うモデル、先回りで和訳する点数、和訳に入れる本文の最大文字数
translate_model = "sonnet"
translate_min_score = 80
translate_max_input_chars = 20000
# 語彙の整理（LLM が足したトピックの表記揺れの統合）に使うモデルと、整理の間隔（日）
tidy_model = "sonnet"
tidy_interval_days = 7
# 本文が無く要約できない英語記事の見出しの和訳に使うモデルと、1 回の呼び出しで訳す見出しの数
title_model = "sonnet"
title_batch_size = 30

[quota]
# 時間帯の判定に使う時差（JST）
timezone_offset_hours = 9
# 時間帯ごとの 5 時間枠の上限（start <= 時 < end、現地時刻）。日中は多く、開発に使う深夜は少なく
slots = [
  { start = 3, end = 8, max_five_hour = 0.20 },
  { start = 10, end = 15, max_five_hour = 0.85 },
  { start = 16, end = 21, max_five_hour = 0.60 },
]
default_max_five_hour = 0.20
# 週次枠の絶対上限と、直線的な消費より何日分先行してよいか
weekly_max = 0.70
pace_ahead_days = 1.0
# 1 回の実行で呼び出してよい回数
max_calls_per_run = 30

# copilot-cli で呼ぶときの AI Credits の月の予算（backend = "copilot-cli" なら必須）。今月（UTC の暦月。JST では
# 毎月 1 日 9 時に戻る）の消費を、monthly_credits × 月の経過割合 × pace までに抑える。1 回の実行の呼び出し回数の上限は
# [quota] の max_calls_per_run を使う
# [copilot_quota]
# プランの月のクレジット（Pro は 1500、Pro+ は 7000）。プランで大きく違うので既定値は無い
# monthly_credits = 1500
# 月の経過割合のうち使ってよい割合。対話で使う Copilot の消費は nucrawler から見えないので、その分の余裕を残す
# pace = 0.8

[web]
# 待ち受けるアドレス。スマホから Tailscale 経由で見るなら tailnet の IP（100.x.y.z:8080 など）にする
bind = "127.0.0.1:8080"
# 一覧に既定で出す最低点、期間（日）、最大件数
min_score = 50
list_days = 7
list_limit = 200
# 一覧を見てからこの分数以内は同じ訪問として「前回から」の区切りを保つ
visit_gap_minutes = 30
# 閾値未満の記事から毎日この数だけ無作為に選び、一覧の「確認枠」に出す（見逃しを確かめるため）。0 なら出さない
explore_per_day = 2

[recommend]
# 推薦点（LLM の点数に、記事に付けた評価から学んだ補正を足した点数）の補正の強さ。大きいほど LLM の点数に近いまま。
# 20 では、評価 1 件で特徴を共有する記事が動くのは数点で、同じ傾向の評価が数十件そろうとはっきり効く。
# 正の有限値（0 以下・inf・nan は設定の誤り）
prior_strength = 20.0
