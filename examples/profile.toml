weight = 1.0
note = "再稼働審査、新規制基準、バックフィット、検査制度（ROP）"

[[interest]]
topic = "燃料"
weight = 0.9
note = "事故耐性燃料（ATF）、高燃焼度、MOX"

[[interest]]
topic = "高経年化"
weight = 0.8
note = "60 年超運転、材料劣化、長期施設管理計画"

[[interest]]
topic = "安全解析"
weight = 0.7
note = "確率論的リスク評価（PRA）、熱水力、シビアアクシデント"

[[interest]]
