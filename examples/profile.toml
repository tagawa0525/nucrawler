# 関心プロファイル。`nucrawler profile import examples/profile.toml` で DB に取り込む。
# weight は 0〜1（大きいほど推薦で重視）。note は採点の際に LLM へ渡す補足。

# 推薦から外したい話題（TOML の仕様上、[[interest]] より前に書く）
exclude = ["核兵器", "核融合"]

[[interest]]
