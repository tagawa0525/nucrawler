# RSS が無いので一覧ページを読む。リリースの本文は主に PDF
[[source]]
id = "kepco"
name = "関西電力"
label = "関電"
kind = "html_list"
url = "https://www.kepco.co.jp/corporate/pr/"
lang = "ja"
category = "utility"
filter = { keywords = ["原子力", "原子炉", "美浜", "高浜", "大飯", "使用済燃料"] }
list = { link = ".prlist_cont dd a", date_in_url = "yyyymmdd" }

# グループ各社（パワーグリッド、リニューアブルパワーなど）のリリースも同じ一覧に載る
[[source]]
id = "tepco"
name = "東京電力"
label = "東電"
kind = "html_list"
url = "https://www.tepco.co.jp/press/release/index-j.html"
lang = "ja"
category = "utility"
filter = { keywords = ["原子力", "原子炉", "柏崎", "福島第一", "福島第二", "東通", "処理水", "廃炉", "使用済燃料"] }
list = { link = ".news-element-wrapper dd > a", date_in_url = "yymmdd", title_skip = ".doc-add-icon" }

# プレスリリースの一覧は年度ごとの URL なので、お知らせのページから最新の年度をたどる
[[source]]
id = "japc"
name = "日本原子力発電"
label = "原電"
kind = "html_list"
url = "https://www.japc.co.jp/news/index.html"
lang = "ja"
category = "utility"
list = { link = "#main_cont dd > a", date_in_url = "yyyymmdd", follow = "#main_cont h3 > a" }

