# 巡回するソースの一覧。$XDG_CONFIG_HOME/nucrawler/sources.toml に置く。
#
# kind:     feed（RSS/Atom/RDF）| fepc_json（電事連のニュース JSON）| html_list（ニュース一覧ページ）
# lang:     en（要約と和訳）| ja（要約のみ）
# category: regulator | industry | research | utility | vendor | paper
# label:    画面に出す短い名前。省略時は name
# enabled:  省略時 true
# filter:   原子力関連に絞り込む。keywords（タイトル・概要に含む）か url_contains（URL に含む）の
#           いずれかに一致したものだけを取り込む。省略時はすべて取り込む。
# list:     html_list の一覧ページの読み方
#           link        記事へのリンク（a 要素）の CSS セレクタ
#           date_in_url リンク先のファイル名の日付（yyyymmdd | yymmdd）。省略時は取得日時
#           title_skip  見出しから除く要素の CSS セレクタ（会社名のラベルなど）
#           follow      一覧の前にたどるリンクの CSS セレクタ（年度ごとに URL が変わる一覧など）

# --- 規制当局 ---

[[source]]
id = "nrc-news"
name = "US NRC News Releases"
label = "NRC"
kind = "feed"
url = "https://www.nrc.gov/public-involve/rss?feed=news"
lang = "en"
category = "regulator"

[[source]]
id = "nrc-event"
name = "US NRC Event Notification Reports"
label = "NRC 事象報告"
kind = "feed"
url = "https://www.nrc.gov/public-involve/rss?feed=event"
lang = "en"
category = "regulator"
filter = { keywords = ["Power Reactor"] }

[[source]]
id = "iaea"
name = "IAEA Top News"
label = "IAEA"
kind = "feed"
url = "https://www.iaea.org/feeds/topnews"
lang = "en"
category = "regulator"

